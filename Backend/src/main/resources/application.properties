spring.application.name=nexus

# ------------------------------------------------------------------
# 1. Database Connection (all overridable via environment variables)
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Nexusdb}
spring.datasource.username=${DB_USERNAME:nexus_user}
spring.datasource.password=${DB_PASSWORD:nexus_pass}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------
# 2. JPA & Hibernate
# ------------------------------------------------------------------
# 'validate' in real environments — schema changes go through Flyway migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Prevents lazy-loading in views/serializers from opening surprise extra queries per request.
spring.jpa.open-in-view=false

# Flyway schema migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=${EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.chat.options.model=${CHAT_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.3

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:50MB}

# ------------------------------------------------------------------
# 3. File Storage (MinIO - S3 compatible)
# ------------------------------------------------------------------
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:nexus_admin}
minio.secret-key=${MINIO_SECRET_KEY:nexus_minio_pass}
minio.bucket-name=${MINIO_BUCKET:nexus-documents}

# ------------------------------------------------------------------
# 4. JWT — secret MUST be supplied via env var in any real deployment.
#    The fallback below is for local dev only and is intentionally weak.
# ------------------------------------------------------------------
jwt.secret=${JWT_SECRET:AAudHgc8scwtJnTUFRCEMQWHvJhWmVRf3KHS0nP4kxf}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------
# 5. CORS
# ------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ------------------------------------------------------------------
# 6. RAG tuning
# ------------------------------------------------------------------
rag.chunk.size=${RAG_CHUNK_SIZE:800}
rag.chunk.overlap=${RAG_CHUNK_OVERLAP:100}
rag.retrieval.top-k=${RAG_TOP_K:5}
rag.retrieval.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.5}
rag.chat.history-window=${RAG_HISTORY_WINDOW:6}

# ------------------------------------------------------------------
# 7. Async processing (document ingestion pipeline)
# ------------------------------------------------------------------
async.executor.core-pool-size=${ASYNC_CORE_POOL_SIZE:4}
async.executor.max-pool-size=${ASYNC_MAX_POOL_SIZE:8}
async.executor.queue-capacity=${ASYNC_QUEUE_CAPACITY:100}

# ------------------------------------------------------------------
# 8. Server / logging / observability
# ------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

logging.level.root=INFO
logging.level.com.Let.s_Code.nexus=${APP_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ------------------------------------------------------------------
# 9. Demo accounts seeding (local dev only)
# ------------------------------------------------------------------
nexus.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:true}
nexus.demo-accounts.admin-email=${DEMO_ADMIN_EMAIL:admin@example.com}
nexus.demo-accounts.admin-password=${DEMO_ADMIN_PASSWORD:Password123}
nexus.demo-accounts.user-email=${DEMO_USER_EMAIL:user@example.com}
nexus.demo-accounts.user-password=${DEMO_USER_PASSWORD:Password123}

